name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, targets: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-musl }
          - { os: macos-latest, targets: aarch64-apple-darwin x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --locked --target "$t"
            tar -czf "clodo-$t.tar.gz" -C "target/$t/release" clodo
          done
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # all build jobs race to create the release; only the first one succeeds
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" clodo-*.tar.gz --clobber
